<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Finance Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link href="/static/css/style.css" rel="stylesheet">
<style>
  body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; }
  .login-logo { width: 56px; height: 56px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 14px;
    display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700; color: #fff; margin: 0 auto 1rem; }
  .login-title { color: #f1f5f9; font-size: 1.4rem; font-weight: 700; text-align: center; }
  .login-sub { color: #94a3b8; text-align: center; font-size: 0.875rem; margin-bottom: 1.8rem; }
  .form-label { color: #cbd5e1; font-size: 0.875rem; font-weight: 500; }
  .form-control { background: #0f172a; border: 1px solid #334155; color: #f1f5f9; border-radius: 8px; }
  .form-control:focus { background: #0f172a; border-color: #6366f1; color: #f1f5f9; box-shadow: 0 0 0 3px rgba(99,102,241,.2); }
  .form-control::placeholder { color: #475569; }
  .btn-signin { background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; border-radius: 8px;
    padding: .65rem; font-weight: 600; font-size: .95rem; width: 100%; color: #fff; }
  .btn-signin:hover { opacity: .9; color: #fff; }
  .alert { border-radius: 8px; font-size: .875rem; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">₹</div>
  <div class="login-title">Finance Tracker</div>
  <div class="login-sub">Sign in to your account</div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ 'danger' if cat == 'danger' else 'info' }} py-2 mb-3">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" placeholder="Enter username"
        autofocus autocomplete="username" required>
    </div>
    <div class="mb-4">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Enter password"
        autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-signin">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </button>
    <div class="text-center mt-3">
      <a href="/forgot-password" class="text-secondary small">Forgot password?</a>
    </div>
  </form>
  <hr style="border-color:#334155; margin: 1.5rem 0;">
  <div class="text-center">
    <span class="text-muted small">Don't have an account?</span>
    <a href="/register" class="btn btn-outline-light btn-sm ms-2">Create Account</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
