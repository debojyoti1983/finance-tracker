{% extends "base.html" %}
{% block title %}Profile — Finance Tracker{% endblock %}
{% block content %}
<div class="page-header">
  <h4 class="page-title">My Profile</h4>
</div>
<div class="px-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="ret-form-card">
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" name="name" class="form-control" value="{{ profile.name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Date of Birth</label>
              <input type="date" name="dob" class="form-control" value="{{ profile.dob or '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" value="{{ profile.email or '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="tel" name="phone" class="form-control" value="{{ profile.phone or '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Country</label>
              <select name="country" id="profileCountry" class="form-select" onchange="updateGovtId('profileCountry','profileGovtIdLabel','profileGovtIdInput','profileGovtIdType')">
                {% set countries = ['India','United States','United Kingdom','Canada','Australia','Germany','France','Singapore','UAE','New Zealand','South Africa','Brazil','Japan','Other'] %}
                {% for c in countries %}
                <option value="{{ c }}" {% if (profile.country or 'India') == c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" id="profileGovtIdLabel">{{ profile.govt_id_type or 'PAN Number' }}</label>
              <input type="hidden" name="govt_id_type" id="profileGovtIdType" value="{{ profile.govt_id_type or 'PAN' }}">
              <input type="text" name="pan" id="profileGovtIdInput" class="form-control"
                value="{{ profile.pan or '' }}" style="text-transform:uppercase"
                placeholder="{{ profile.govt_id_type or 'PAN' }}">
            </div>
            <div class="col-12"><hr><h6 class="text-muted">Income</h6></div>
            <div class="col-md-6">
              <label class="form-label">Monthly Salary/Income (₹)</label>
              <input type="number" name="monthly_income" class="form-control" value="{{ profile.monthly_income or 0 }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Other Monthly Income (₹)</label>
              <input type="number" name="other_income" class="form-control" value="{{ profile.other_income or 0 }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Savings Goal (%)</label>
              <input type="number" name="savings_goal_percent" class="form-control"
                value="{{ profile.savings_goal_percent or 20 }}" min="0" max="100">
            </div>
            <div class="col-12"><hr><h6 class="text-muted">Demat Account</h6></div>
            <div class="col-md-6">
              <label class="form-label">Demat Broker</label>
              <select name="demat_broker" class="form-select">
                <option value="">Select</option>
                {% for b in ['Zerodha','Groww','Upstox','Angel One','ICICI Direct','HDFC Securities','Paytm Money','Other'] %}
                <option {% if profile.demat_broker == b %}selected{% endif %}>{{ b }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Demat / Client ID</label>
              <input type="text" name="demat_id" class="form-control" value="{{ profile.demat_id or '' }}">
            </div>
            <div class="col-12 mt-2">
              <button type="submit" class="btn btn-primary px-4">Save Changes</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const COUNTRY_IDS = {
  'India':          { type: 'PAN',          label: 'PAN Number',                  placeholder: 'ABCDE1234F',          maxlength: 10 },
  'United States':  { type: 'SSN',          label: 'Social Security No. (SSN)',   placeholder: 'XXX-XX-XXXX',         maxlength: 11 },
  'United Kingdom': { type: 'NI Number',    label: 'National Insurance No.',      placeholder: 'AB 12 34 56 C',       maxlength: 13 },
  'Canada':         { type: 'SIN',          label: 'Social Insurance No. (SIN)',  placeholder: '123 456 789',         maxlength: 11 },
  'Australia':      { type: 'TFN',          label: 'Tax File Number (TFN)',       placeholder: '123 456 789',         maxlength: 11 },
  'Germany':        { type: 'Steuer-ID',    label: 'Tax ID (Steuer-ID)',          placeholder: '12345678901',         maxlength: 11 },
  'France':         { type: 'NIR',          label: 'Social Security No. (NIR)',   placeholder: '1 99 99 99 999 999', maxlength: 21 },
  'Singapore':      { type: 'NRIC/FIN',     label: 'NRIC / FIN',                  placeholder: 'S1234567A',           maxlength: 9  },
  'UAE':            { type: 'Emirates ID',  label: 'Emirates ID',                 placeholder: '784-XXXX-XXXXXXX-X', maxlength: 18 },
  'New Zealand':    { type: 'IRD',          label: 'IRD Number',                  placeholder: '12-345-678',          maxlength: 11 },
  'South Africa':   { type: 'ID Number',    label: 'SA ID Number',                placeholder: '9001015009087',       maxlength: 13 },
  'Brazil':         { type: 'CPF',          label: 'CPF Number',                  placeholder: '000.000.000-00',      maxlength: 14 },
  'Japan':          { type: 'My Number',    label: 'My Number (マイナンバー)',     placeholder: '000000000000',        maxlength: 12 },
  'Other':          { type: 'National ID',  label: 'National ID',                 placeholder: 'Your national ID',   maxlength: 30 },
};

function updateGovtId(countryId, labelId, inputId, typeId) {
  const country = document.getElementById(countryId).value;
  const info = COUNTRY_IDS[country] || COUNTRY_IDS['Other'];
  document.getElementById(labelId).textContent = info.label;
  const inp = document.getElementById(inputId);
  inp.placeholder = info.placeholder;
  inp.maxLength = info.maxlength;
  document.getElementById(typeId).value = info.type;
}
</script>
{% endblock %}
