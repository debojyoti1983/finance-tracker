<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup — Finance Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="setup-page">
<div class="setup-container">
  <div class="setup-header text-center mb-4">
    <div class="setup-logo">₹</div>
    <h1 class="setup-title">Finance Tracker</h1>
    <p class="text-muted">Your personal finance dashboard — set up your profile to get started</p>
  </div>

  <form method="POST" class="setup-form">
    <!-- Step 1: Personal -->
    <div class="setup-card">
      <h5 class="card-section-title"><i class="bi bi-person-fill me-2"></i>Personal Details</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Full Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" required placeholder="Your full name">
        </div>
        <div class="col-md-6">
          <label class="form-label">Date of Birth <span class="text-danger">*</span></label>
          <input type="date" name="dob" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" name="email" class="form-control" placeholder="you@email.com" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone <span class="text-danger">*</span></label>
          <input type="tel" name="phone" class="form-control" placeholder="+91 XXXXX XXXXX" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Country</label>
          <select name="country" id="setupCountry" class="form-select" onchange="updateGovtId('setupCountry','setupGovtIdLabel','setupGovtIdInput','setupGovtIdType')">
            <option value="India" selected>India</option>
            <option value="United States">United States</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>
            <option value="Germany">Germany</option>
            <option value="France">France</option>
            <option value="Singapore">Singapore</option>
            <option value="UAE">UAE</option>
            <option value="New Zealand">New Zealand</option>
            <option value="South Africa">South Africa</option>
            <option value="Brazil">Brazil</option>
            <option value="Japan">Japan</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" id="setupGovtIdLabel">PAN Number</label>
          <input type="hidden" name="govt_id_type" id="setupGovtIdType" value="PAN">
          <input type="text" name="pan" id="setupGovtIdInput" class="form-control"
            placeholder="ABCDE1234F" maxlength="10" style="text-transform:uppercase">
        </div>
      </div>
    </div>

    <!-- Step 2: Income -->
    <div class="setup-card">
      <h5 class="card-section-title"><i class="bi bi-cash-coin me-2"></i>Income & Savings</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Monthly Salary / Income (₹) <span class="text-danger">*</span></label>
          <input type="number" name="monthly_income" class="form-control" placeholder="e.g. 75000" min="0" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Other Monthly Income (₹)</label>
          <input type="number" name="other_income" class="form-control" placeholder="Rent, freelance, etc." min="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">Monthly Expenses (₹)</label>
          <input type="number" name="monthly_expense" class="form-control" placeholder="e.g. 40000" min="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">Savings Goal (%)</label>
          <input type="number" name="savings_goal_percent" class="form-control" value="20" min="0" max="100">
          <small class="text-muted">% of income to save each month</small>
        </div>
      </div>
    </div>

    <!-- Step 3: Bank Account -->
    <div class="setup-card">
      <h5 class="card-section-title"><i class="bi bi-bank me-2"></i>Primary Bank Account</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Bank Name</label>
          <input type="text" name="bank_name" class="form-control" placeholder="e.g. HDFC Bank">
        </div>
        <div class="col-md-6">
          <label class="form-label">Account Type</label>
          <select name="account_type" class="form-select">
            <option value="savings">Savings</option>
            <option value="salary">Salary</option>
            <option value="current">Current</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Account Number (last 4 digits)</label>
          <input type="text" name="account_number" class="form-control" placeholder="XXXX" maxlength="4">
        </div>
        <div class="col-md-6">
          <label class="form-label">Current Balance (₹)</label>
          <input type="number" name="bank_balance" class="form-control" placeholder="e.g. 50000" min="0">
        </div>
      </div>
    </div>

    <!-- Step 4: Demat -->
    <div class="setup-card">
      <h5 class="card-section-title"><i class="bi bi-graph-up-arrow me-2"></i>Demat & Investment Account</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Demat Broker</label>
          <select name="demat_broker" class="form-select">
            <option value="">Select broker</option>
            <option>Zerodha</option>
            <option>Groww</option>
            <option>Upstox</option>
            <option>Angel One</option>
            <option>ICICI Direct</option>
            <option>HDFC Securities</option>
            <option>Paytm Money</option>
            <option>Other</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Demat / Client ID</label>
          <input type="text" name="demat_id" class="form-control" placeholder="DP/Client ID">
        </div>
      </div>
    </div>

    <!-- Step 5: Retirement -->
    <div class="setup-card">
      <h5 class="card-section-title"><i class="bi bi-umbrella me-2"></i>Retirement Planning</h5>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Current Age</label>
          <input type="number" name="current_age" class="form-control" placeholder="e.g. 30" min="18" max="80">
        </div>
        <div class="col-md-4">
          <label class="form-label">Retirement Age</label>
          <input type="number" name="retirement_age" class="form-control" value="60" min="40" max="80">
        </div>
        <div class="col-md-4">
          <label class="form-label">Life Expectancy</label>
          <input type="number" name="life_expectancy" class="form-control" value="80" min="60" max="100">
        </div>
        <div class="col-md-6">
          <label class="form-label">Existing Retirement Corpus (₹)</label>
          <input type="number" name="current_corpus" class="form-control" placeholder="PF + NPS + other" min="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">Monthly SIP for Retirement (₹)</label>
          <input type="number" name="monthly_sip" class="form-control" placeholder="e.g. 10000" min="0">
        </div>
      </div>
    </div>

    <div class="text-center mt-4 mb-5">
      <button type="submit" class="btn btn-primary btn-lg px-5">
        <i class="bi bi-rocket-takeoff me-2"></i>Set Up My Dashboard
      </button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const COUNTRY_IDS = {
  'India':          { type: 'PAN',          label: 'PAN Number',                  placeholder: 'ABCDE1234F',          maxlength: 10 },
  'United States':  { type: 'SSN',          label: 'Social Security No. (SSN)',   placeholder: 'XXX-XX-XXXX',         maxlength: 11 },
  'United Kingdom': { type: 'NI Number',    label: 'National Insurance No.',      placeholder: 'AB 12 34 56 C',       maxlength: 13 },
  'Canada':         { type: 'SIN',          label: 'Social Insurance No. (SIN)',  placeholder: '123 456 789',         maxlength: 11 },
  'Australia':      { type: 'TFN',          label: 'Tax File Number (TFN)',       placeholder: '123 456 789',         maxlength: 11 },
  'Germany':        { type: 'Steuer-ID',    label: 'Tax ID (Steuer-ID)',          placeholder: '12345678901',         maxlength: 11 },
  'France':         { type: 'NIR',          label: 'Social Security No. (NIR)',   placeholder: '1 99 99 99 999 999', maxlength: 21 },
  'Singapore':      { type: 'NRIC/FIN',     label: 'NRIC / FIN',                  placeholder: 'S1234567A',           maxlength: 9  },
  'UAE':            { type: 'Emirates ID',  label: 'Emirates ID',                 placeholder: '784-XXXX-XXXXXXX-X', maxlength: 18 },
  'New Zealand':    { type: 'IRD',          label: 'IRD Number',                  placeholder: '12-345-678',          maxlength: 11 },
  'South Africa':   { type: 'ID Number',    label: 'SA ID Number',                placeholder: '9001015009087',       maxlength: 13 },
  'Brazil':         { type: 'CPF',          label: 'CPF Number',                  placeholder: '000.000.000-00',      maxlength: 14 },
  'Japan':          { type: 'My Number',    label: 'My Number (マイナンバー)',     placeholder: '000000000000',        maxlength: 12 },
  'Other':          { type: 'National ID',  label: 'National ID',                 placeholder: 'Your national ID',   maxlength: 30 },
};

function updateGovtId(countryId, labelId, inputId, typeId) {
  const country = document.getElementById(countryId).value;
  const info = COUNTRY_IDS[country] || COUNTRY_IDS['Other'];
  document.getElementById(labelId).textContent = info.label;
  const inp = document.getElementById(inputId);
  inp.placeholder = info.placeholder;
  inp.maxLength = info.maxlength;
  document.getElementById(typeId).value = info.type;
}
</script>
</body>
</html>
